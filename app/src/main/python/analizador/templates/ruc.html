<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta por RUC</title>
<style>
:root{--azul:#0f172a;--azul2:#1e3a8a;--naranja:#f59e0b;--tinta:#0f172a;--gris:#64748b;--fondo:#f1f5f9;--blanco:#fff;--verde:#16a34a;--rojo:#dc2626;--borde:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Segoe UI",sans-serif;background:var(--fondo);color:var(--tinta);padding-bottom:44px}
#barra{height:56px;background:var(--azul);display:flex;align-items:center;gap:10px;padding:0 12px}
#barra a{font-size:14px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:9px 14px;text-decoration:none}
header{background:var(--azul);color:#fff;padding:4px 18px 24px}
header h1{font-size:20px;letter-spacing:-.3px}
header h1 b{color:var(--naranja)}
header p{font-size:13px;opacity:.75;margin-top:4px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:14px;padding:18px;margin-top:14px;box-shadow:0 4px 14px rgba(15,23,42,.05)}
.card h2{font-size:16px;margin-bottom:3px}
.card .hint{font-size:13px;color:var(--gris);margin-bottom:14px}
input[type=text]{width:100%;font-size:20px;letter-spacing:1px;font-family:ui-monospace,monospace;padding:14px;border:2px solid var(--borde);border-radius:12px;text-align:center;background:#f8fafc}
input[type=text]:focus{outline:0;border-color:var(--naranja);background:#fff}
textarea{width:100%;font-size:14px;font-family:ui-monospace,monospace;padding:12px;border:2px solid var(--borde);border-radius:12px;background:#f8fafc;min-height:78px;resize:vertical}
textarea:focus{outline:0;border-color:var(--naranja);background:#fff}
button{border:0;border-radius:10px;font-weight:600;cursor:pointer;font-size:15px}
.btn-primario{background:var(--naranja);color:#111;padding:14px;width:100%;margin-top:12px}
.btn-primario:disabled{background:#e2e8f0;color:#94a3b8}
.btn-chico{background:var(--azul2);color:#fff;padding:10px 15px;font-size:13px;margin:10px 8px 0 0}
.btn-chico.verde{background:var(--verde)}
.btn-chico.gris{background:#475569}
.enlace{background:none;color:var(--azul2);font-size:13px;text-decoration:underline;padding:8px 0;margin-top:6px}
.estado{margin-top:12px;font-size:13px;color:var(--gris);min-height:18px}
.estado.trabajando{color:var(--azul2);font-weight:600}
.err{color:var(--rojo)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin:0 4px 4px 0}
.tag.si{background:#dcfce7;color:#15803d}
.tag.no{background:#fee2e2;color:#b91c1c}
.tag.info{background:#e0e7ff;color:#3730a3}
.emp{font-size:17px;font-weight:700;line-height:1.35}
.ruc{font-family:ui-monospace,monospace;color:var(--gris);font-size:13px;margin-bottom:8px}
.fila{font-size:13px;line-height:1.75;display:flex;gap:8px}
.fila b{color:var(--gris);font-weight:600;min-width:96px;flex-shrink:0}
.fila span{word-break:break-word}
.regs{margin-top:12px}
.regs h4{font-size:13px;color:var(--gris);margin-bottom:6px}
.reg{background:#f8fafc;border:1px solid var(--borde);border-radius:10px;padding:9px 11px;margin-top:6px;font-size:12px;line-height:1.5}
.reg .num{font-family:ui-monospace,monospace;font-weight:700;color:#b45309}
.reg .venc{color:var(--gris)}
.mas{font-size:12px;color:var(--azul2);margin-top:8px;cursor:pointer;text-decoration:underline}
.sep{height:1px;background:var(--borde);margin:14px 0}
</style>
</head>
<body>

<div id="barra">
  <a href="/">&larr; Inicio</a>
  <a href="/contratos">Contratos</a>
  <a href="/buenapro">Buena Pro</a>
</div>

<header>
  <h1>Consulta por <b>RUC</b></h1>
  <p>Sin PDF: escribe el RUC y sale OSCE + DIGESA</p>
</header>

<div class="wrap">

<div class="card">
  <h2>Buscar empresa</h2>
  <p class="hint">Escribe el RUC de 11 digitos. Consulta el RNP de OSCE y los registros sanitarios de DIGESA.</p>

  <input type="text" id="ruc" inputmode="numeric" maxlength="11" placeholder="20123456789" autocomplete="off">
  <button class="btn-primario" id="buscar" disabled>Consultar</button>
  <button class="enlace" id="verLote">Consultar varios RUC a la vez</button>

  <div id="zonaLote" style="display:none;margin-top:10px">
    <textarea id="rucs" placeholder="Pega aqui varios RUC (uno por linea, o separados por coma)"></textarea>
    <button class="btn-primario" id="buscarLote">Consultar la lista</button>
  </div>

  <div class="estado" id="estado"></div>
</div>

<div id="resultados"></div>

</div>

<script>
const inp=document.getElementById('ruc'),btn=document.getElementById('buscar'),
estado=document.getElementById('estado'),cont=document.getElementById('resultados'),
zonaLote=document.getElementById('zonaLote'),taLote=document.getElementById('rucs');
let consultas=[];

const DIAS=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
function selloFecha(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return DIAS[d.getDay()]+'-'+p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear()+
         '_'+p(d.getHours())+'-'+p(d.getMinutes())+'-'+p(d.getSeconds());
}
function nombreArchivo(base,ext){return base+'_'+selloFecha()+'.'+ext}

inp.oninput=()=>{
  inp.value=inp.value.replace(/\D/g,'').slice(0,11);
  btn.disabled=inp.value.length!==11;
};
inp.onkeydown=e=>{if(e.key==='Enter'&&!btn.disabled)btn.click()};
document.getElementById('verLote').onclick=()=>{
  const abierto=zonaLote.style.display==='block';
  zonaLote.style.display=abierto?'none':'block';
  document.getElementById('verLote').textContent=abierto?'Consultar varios RUC a la vez':'Ocultar lista';
};

function esc(t){return String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function tag(ok,si,no){return '<span class="tag '+(ok?'si':'no')+'">'+(ok?si:no)+'</span>'}

function tarjeta(c,i){
  const o=c.osce||{},d=c.digesa||{},regs=d.registros||[];
  const tels=[...(o.telefonos||[]),...(o.celulares||[]),...(d.telefonos||[])].filter(Boolean);
  const visibles=regs.slice(0,5).map(r=>
    '<div class="reg"><span class="num">'+esc(r.numero)+'</span> &middot; '+esc(r.producto||'-')+
    '<br><span class="venc">Emitido: '+esc(r.fecha_emision||'-')+' &middot; Vence: '+esc(r.fecha_vencimiento||'-')+'</span></div>').join('');
  const resto=regs.length>5
    ? '<div class="mas" onclick="verTodo('+i+')">Ver los '+regs.length+' registros</div>' : '';

  return '<div class="card">'+
    '<div class="emp">'+esc(o.razon_social||c.razon_social||'Empresa sin nombre en OSCE')+'</div>'+
    '<div class="ruc">RUC '+esc(c.ruc)+'</div>'+
    tag(o.es_apto,'Apto OSCE','No apto OSCE')+
    tag(o.estado_rnp==='Habilitado','RNP habilitado',o.estado_rnp||'RNP sin dato')+
    tag(d.tiene_digesa,'Con DIGESA ('+regs.length+')','Sin DIGESA')+
    '<span class="tag info">'+esc(d.tipo||'-')+'</span>'+
    '<div class="sep"></div>'+
    '<div class="fila"><b>Telefonos</b><span>'+(tels.length?esc(tels.join(', ')):'-')+'</span></div>'+
    '<div class="fila"><b>Email</b><span>'+esc((o.emails||[]).join(', ')||'-')+'</span></div>'+
    '<div class="fila"><b>Rep. legal</b><span>'+esc(d.rep_legal||'-')+'</span></div>'+
    '<div class="fila"><b>Direccion</b><span>'+esc(d.direccion||'-')+'</span></div>'+
    (regs.length?'<div class="regs"><h4>Registros sanitarios DIGESA</h4>'+visibles+resto+'</div>'
                :'<div class="regs"><h4>Sin registros sanitarios en DIGESA</h4></div>')+
    '</div>';
}

function verTodo(i){
  const regs=(consultas[i].digesa||{}).registros||[];
  const caja=document.querySelectorAll('#resultados .card')[i].querySelector('.regs');
  caja.innerHTML='<h4>Registros sanitarios DIGESA ('+regs.length+')</h4>'+regs.map(r=>
    '<div class="reg"><span class="num">'+esc(r.numero)+'</span> &middot; '+esc(r.producto||'-')+
    '<br><span class="venc">Emitido: '+esc(r.fecha_emision||'-')+' &middot; Vence: '+esc(r.fecha_vencimiento||'-')+'</span></div>').join('');
}

function pintar(){
  cont.innerHTML=consultas.map(tarjeta).join('')+
    (consultas.length?'<div class="card">'+
      '<button class="btn-chico verde" onclick="exportar(\'excel\')">Excel</button>'+
      '<button class="btn-chico" onclick="exportar(\'pdf\')">PDF</button>'+
      '<button class="btn-chico gris" onclick="limpiar()">Limpiar</button></div>':'');
}
function limpiar(){consultas=[];pintar();estado.textContent=''}

async function consultarUno(ruc){
  const r=await fetch('/ruc/buscar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ruc:ruc})});
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}

btn.onclick=async()=>{
  const ruc=inp.value;
  btn.disabled=true;estado.classList.add('trabajando');
  estado.textContent='Consultando OSCE y DIGESA de '+ruc+'... puede tardar unos segundos.';
  try{
    const j=await consultarUno(ruc);
    consultas=[j].concat(consultas.filter(c=>c.ruc!==ruc));
    pintar();
    estado.classList.remove('trabajando');
    estado.textContent='Listo.';
    inp.value='';
  }catch(e){
    estado.classList.remove('trabajando');
    estado.innerHTML='<span class="err">'+esc(e.message)+'</span>';
  }
  btn.disabled=inp.value.length!==11;
};

document.getElementById('buscarLote').onclick=async()=>{
  const rucs=(taLote.value.match(/\d{11}/g)||[]).filter((v,i,a)=>a.indexOf(v)===i);
  if(!rucs.length){estado.innerHTML='<span class="err">No encontre ningun RUC de 11 digitos.</span>';return}
  estado.classList.add('trabajando');
  const previas=consultas.slice(),nuevas=[];
  for(let i=0;i<rucs.length;i++){
    estado.textContent='Consultando '+(i+1)+' de '+rucs.length+': '+rucs[i]+'...';
    try{nuevas.push(await consultarUno(rucs[i]))}catch(e){console.warn(rucs[i],e)}
    consultas=nuevas.concat(previas.filter(c=>!nuevas.some(x=>x.ruc===c.ruc)));
    pintar();
  }
  estado.classList.remove('trabajando');
  estado.textContent='Listo: '+nuevas.length+' de '+rucs.length+' consultados.';
};

async function exportar(tipo){
  if(!consultas.length) return;
  const url=tipo==='excel'?'/ruc/exportar':'/ruc/exportar_pdf';
  const nombre=nombreArchivo('consulta_ruc',tipo==='excel'?'xlsx':'pdf');
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({datos:consultas})});
    if(!r.ok) throw new Error('No pude generar el archivo');
    const blob=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=nombre;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>a.remove(),1000);
  }catch(e){alert('Error: '+e.message)}
}
</script>

<script>
(function(){
 if(!window.AndroidBridge) return;
 var blobs=new Map();
 var origURL=URL.createObjectURL.bind(URL);
 URL.createObjectURL=function(b){var u=origURL(b);blobs.set(u,b);return u};
 function enviar(a){
   var b=blobs.get(a.href);
   if(!b) return false;
   var fr=new FileReader();
   fr.onload=function(){
     try{AndroidBridge.guardarArchivo(a.download||'archivo.bin',fr.result.split(',')[1])}
     catch(e){alert('No pude guardar: '+e)}
   };
   fr.readAsDataURL(b);
   return true;
 }
 var clickOrig=HTMLAnchorElement.prototype.click;
 HTMLAnchorElement.prototype.click=function(){
   if(this.href&&this.href.indexOf('blob:')===0&&enviar(this)) return;
   return clickOrig.apply(this,arguments);
 };
 document.addEventListener('click',function(e){
   var a=e.target.closest?e.target.closest('a'):null;
   if(a&&a.href&&a.href.indexOf('blob:')===0&&enviar(a)) e.preventDefault();
 },true);
})();
</script>
</body>
</html>
